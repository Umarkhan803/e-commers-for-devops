apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  NODE_ENV: "production"
  PORT: "4000"
  API_PREFIX: "/api/v1"
  REDIS_URL: "redis://redis:6379"
  # MONGO_URI lives in api-secret (Atlas). Do not set mongodb://mongo here.
  CORS_ORIGINS: "*"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL: "30d"
  JWT_REFRESH_TTL_SECONDS: "2592000"
