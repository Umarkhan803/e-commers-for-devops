# SonarQube / SonarCloud project configuration for Nova Commerce
# Used by .github/workflows/ci-cd.yml (sonarqube job)

sonar.projectKey=nova-commerce
sonar.projectName=Nova Commerce
sonar.projectVersion=1.0

# Source roots (frontend SPA + backend API)
sonar.sources=backend/src,frontend/src
sonar.tests=
sonar.sourceEncoding=UTF-8

# Language / exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/public/**,\
  **/*.min.js,\
  backend/src/seed/**,\
  frontend/docs/**

sonar.coverage.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.config.js,\
  **/*.config.ts,\
  backend/src/seed/**,\
  backend/src/scripts/**

# JavaScript / TypeScript
sonar.javascript.file.suffixes=.js,.jsx,.mjs,.cjs
sonar.typescript.file.suffixes=.ts,.tsx

