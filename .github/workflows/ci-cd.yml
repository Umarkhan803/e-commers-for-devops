
name: CI/CD Pipeline

on:
  push:
    branches: 
        - "main"

  pull_request:
    branches: ["main"]


env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  NODE_VERSION: "22"



jobs:

    ci:
     name: CI pipeline
     runs-on: ubuntu-latest
     outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}

     steps:
        # get check out code
      - name: Checkout code 
        uses: actions/checkout@v4
        with:
            fetch-depth: 0
        # setup node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}   
          
        # installing frontend dependencies
      - name: building frontend dependencies
        working-directory: frontend
        run: |
         npm ci
         npm run build

        # installing backend dependencies
      - name: build backend dependencies
        working-directory: backend
        
        run: |
          npm ci
          node --check src/server.js
          node --check src/app.js
          echo "Backend syntax validation passed"

        # scan build using sonar qube
      # - name: Sonar Qube Scan
      #   uses: SonarSource/sonarqube-scan-action@v6
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #   with:
      #     args: >
      #       -Dsonar.qualitygate.wait=true
      #       -Dsonar.qualitygate.timeout=300
      - name:  Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

          # build backend image
      - name: build backend docker image
        run: |
          docker build  -t ${{ env.ECR_REGISTRY }}/nova-commerce/backend:${{ github.sha }}  -f backend/Dockerfile   ./backend

     # scan backend docker image using trivy
      - name: scan backend image
        uses: aquasecurity/trivy-action@0.35.0 
        with:
         image-ref: ${{ env.ECR_REGISTRY }}/nova-commerce/backend:${{ github.sha }}
         
         format: table
         exit-code: 1
         severity: HIGH,CRITICAL
         ignore-unfixed: true
      - name: Push backend image
        run: |
             docker push ${{env.ECR_REGISTRY}}/nova-commerce/backend:${{ github.sha }}

        # build frontend image
      - name: build frontend docker image
        run:  docker build -t ${{ env.ECR_REGISTRY }}/nova-commerce/frontend:${{ github.sha }}  -f nginx/Dockerfile .
 
      # scan frontend docker image using trivy
      - name: scan frontend image
        uses: aquasecurity/trivy-action@0.35.0 
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/nova-commerce/frontend:${{ github.sha }} 
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Push frontend image
        run: |
               docker push ${{env.ECR_REGISTRY}}/nova-commerce/frontend:${{ github.sha }}

    deploy:
      name: updating kubernetes manifests files
      runs-on: ubuntu-latest
      needs: ci

      # steps for cd pipeline
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0


        - name: updating backend docker image tag
          run: |
            sed -i \
            "s|image: .*nova-commerce/backend:.*|image: $ECR_REGISTRY/nova-commerce/backend:${{ needs.ci.outputs.image_tag }}|" \
            kubernetes/api-deploy.yaml


        - name: updating frontend docker image tag
          run: |
            sed -i \
            "s|image: .*nova-commerce/frontend:.*|image: $ECR_REGISTRY/nova-commerce/frontend:${{ needs.ci.outputs.image_tag }}|" \
            kubernetes/web-deploy.yaml
        - name: shows kubernetes changes
          run: |
            git diff -- kubernetes/api-deploy.yaml
            git diff -- kubernetes/web-deploy.yaml

        - name: commit kubernetes manifests files
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add .

            if git diff --cached --quiet; then
              echo "no changes to commit"
              exit 0
            fi

            git commit -m "updated images to ${{ needs.ci.outputs.image_tag }}"

        - name: pushing kubernetes changes in repo
          run: |
            git push