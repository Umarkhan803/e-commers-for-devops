
name: CI/CD Pipeline

on:
  push:
    branches: 
        - "main"

  pull_request:
    branches: ["main"]


env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  NODE_VERSION: "22"

permissions:
  contents: write

jobs:

    ci:
     name: CI pipeline
     runs-on: ubuntu-latest
     outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}

     steps:
      - name: Set image tag
        id: image-tag
        run: |
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        # get check out code
      - name: Checkout code 
        uses: actions/checkout@v4
        with:
            fetch-depth: 0
        # setup node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}   
          
        # installing frontend dependencies
      - name: building frontend dependencies
        working-directory: frontend
        run: |
         npm ci
         npm run build

        # installing backend dependencies
      - name: build backend dependencies
        working-directory: backend
        
        run: |
          npm ci
          node --check src/server.js
          node --check src/app.js
          echo "Backend syntax validation passed"


        # scan build using sonar qube
      # - name: Sonar Qube Scan
      #   uses: SonarSource/sonarqube-scan-action@v6
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #   with:
      #     args: >
      #       -Dsonar.qualitygate.wait=true
      #       -Dsonar.qualitygate.timeout=300

      - name:  Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

          # build backend image
      - name: build backend docker image
        run: |
          docker build  -t ${{ env.ECR_REGISTRY }}/nova-commerce/backend:${{ github.sha }}  -f backend/Dockerfile   ./backend

     # scan backend docker image using trivy
      - name: scan backend image
        uses: aquasecurity/trivy-action@0.35.0 
        with:
         image-ref: ${{ env.ECR_REGISTRY }}/nova-commerce/backend:${{ github.sha }}
         
         format: table
         exit-code: 1
         severity: HIGH,CRITICAL
         ignore-unfixed: true
      - name: push backend image
        run: |
             docker push ${{env.ECR_REGISTRY}}/nova-commerce/backend:${{ github.sha }}

        # build frontend image
      - name: build frontend docker image
        run:  docker build -t ${{ env.ECR_REGISTRY }}/nova-commerce/frontend:${{ github.sha }}  -f nginx/Dockerfile .
 
      # scan frontend docker image using trivy
      - name: scan frontend image
        uses: aquasecurity/trivy-action@0.35.0 
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/nova-commerce/frontend:${{ github.sha }} 
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: push frontend image
        run: |
               docker push ${{env.ECR_REGISTRY}}/nova-commerce/frontend:${{ github.sha }}

     #  ci pipeline
    deploy:
        name: updating kubernetes manifests
        runs-on: ubuntu-latest
        needs: ci
            
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
            
        steps:
            
         - name: Checkout repository
           uses: actions/checkout@v4
           with:
            fetch-depth: 0
            # updating docker images tag in the repo
         - name: updating backend docker image tag
           run: |
              sed -i \
                 "s|^\([[:space:]]*image: .*nova-commerce/backend\).*|\1:${{ needs.ci.outputs.image_tag }}|" \
               kubernetes/api-deploy.yaml
            
         - name: updating frontend docker image tag
           run: |
                sed -i \
                "s|^\([[:space:]]*image: .*nova-commerce/frontend\).*|\1:${{ needs.ci.outputs.image_tag }}|" \
                 kubernetes/web-deploy.yaml
            # shows the changes made in repo
            
         - name: shows kubernetes changes
           run: |
               git diff -- kubernetes/api-deploy.yaml
               git diff -- kubernetes/web-deploy.yaml
            # commit the changes
            
         - name: commit kubernetes manifests
           run: |
               git config user.name "github-actions[bot]"
               git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
               git add kubernetes/api-deploy.yaml kubernetes/web-deploy.yaml
            
               if git diff --cached --quiet; then
               echo "No changes to commit"
               exit 0
               fi
            
               git commit -m "deploy: update images to ${{ needs.ci.outputs.image_tag }}"
              #  pushed in repo
         - name: pushing kubernetes changes in repo
           run: |
              git push origin main

         - name: Send success email
           if: success()
           uses: dawidd6/action-send-mail@v6
           with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{ secrets.MAIL_USERNAME }}
                password: ${{ secrets.MAIL_PASSWORD }}
                subject: "✅ Nova Commerce Pipeline is Successful"
                to: ${{ secrets.MAIL_TO }}
                from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
                html_body: |
                  <!DOCTYPE html>
                  <html>
                  <body style="font-family: Arial, sans-serif; background-color: #f4f6f8; padding: 30px;">

                    <div style="max-width: 650px; margin: auto; background-color: #ffffff; border-radius: 10px; padding: 30px;">

                      <h2 style="color: #2e7d32;">
                        ✅ Nova Commerce CI/CD Pipeline Successfully
                      </h2>

                      <p style="font-size: 16px; color: #333333;">
                        The Nova Commerce CI/CD pipeline has completed successfully.
                      </p>

                      <hr style="border: none; border-top: 1px solid #dddddd;">

                      <h3>Pipeline Details</h3>

                      <table style="width: 100%; border-collapse: collapse;">

                        <tr>
                          <td style="padding: 10px; font-weight: bold;">Repository</td>
                          <td style="padding: 10px;">${{ github.repository }}</td>
                        </tr>

                        <tr>
                          <td style="padding: 10px; font-weight: bold;">Branch</td>
                          <td style="padding: 10px;">${{ github.ref_name }}</td>
                        </tr>

                        <tr>
                          <td style="padding: 10px; font-weight: bold;">Commit</td>
                          <td style="padding: 10px;">${{ github.sha }}</td>
                        </tr>

                        <tr>
                          <td style="padding: 10px; font-weight: bold;">Workflow Run</td>
                          <td style="padding: 10px;">#${{ github.run_number }}</td>
                        </tr>

                      </table>

                      <hr style="border: none; border-top: 1px solid #dddddd;">

                      <div style="background-color: #e8f5e9; padding: 15px; border-radius: 6px; margin-top: 20px;">
                        <strong style="color: #2e7d32;">
                          STATUS: SUCCESS
                        </strong>
                      </div>

                    </div>

                  </body>
                  </html>