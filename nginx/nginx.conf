user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr '
                    'rt=$request_time urt=$upstream_response_time cache=$upstream_http_x_cache';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    keepalive_timeout 65;
    client_max_body_size 2m;
    reset_timedout_connection on;

    # --- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # --- edge rate limiting ------------------------------------------------
    # A coarse gate in front of the API's own per-user limiter, sized to absorb
    # bursts from the storefront while turning away obvious abuse.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --- proxy cache for product imagery -----------------------------------
    proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=image_cache:10m
                     max_size=512m inactive=7d use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
